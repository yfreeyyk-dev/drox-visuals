
name: Build Drox Visuals

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Build
        working-directory: drox-visuals-source/drox-visuals
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: drox-visuals
          path: |
            drox-visuals-source/drox-visuals/build/libs/*.jar
            !drox-visuals-source/drox-visuals/build/libs/*-sources.jar
